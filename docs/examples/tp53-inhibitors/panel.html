"returned_by": ["gene_reactions", "gene_interactions", "reaction_details"], "mentions": 3, "source": "neo4j", "text": null, "cited": true, "claims": [9], "theme": "Reduced expression"}, {"id": "qdrant:O14965#10", "kind": "evidence", "label": "passage", "name": "qdrant:O14965#10", "cite": "qdrant:O14965#10", "returned_by": ["read_snippets"], "mentions": 1, "source": "qdrant", "text": "Also acts as a key regulatory component of the p53/TP53 pathway, and particularly the checkpoint-response pathways critical for oncogenic transformation of cells, by phosphorylating and destabilizing p53/TP53 (PubMed:14702041). Phosphorylates its own inhibitors, the protein phosphatase type 1 (PP1) isoforms, to inhibit their activity (PubMed:11551964).", "status": "fetched", "cited": true, "claims": [4], "theme": "Inactivating modification"}, {"id": "qdrant:O15151#0", "kind": "evidence", "label": "passage", "name": "qdrant:O15151#0", "cite": "qdrant:O15151#0", "returned_by": ["read_snippets"], "mentions": 1, "source": "qdrant", "text": "Contributes to p53/TP53 regulation (PubMed:32300648). Inhibits p53/TP53- and p73/TP73-mediated cell cycle arrest and apoptosis by binding their transcriptional activation domains.", "status": "fetched", "cited": true, "claims": [1], "theme": "Degradation"}, {"id": "qdrant:O15151#2", "kind": "evidence", "label": "passage", "name": "qdrant:O15151#2", "cite": "qdrant:O15151#2", "returned_by": ["read_snippets"], "mentions": 1, "source": "qdrant", "text": "Inhibits degradation of MDM2. Can reverse MDM2-targeted degradation of TP53 while maintaining suppression of TP53 transactivation and apoptotic functions. .", "status": "fetched", "cited": true, "claims": [1], "theme": "Degradation"}, {"id": "qdrant:Q00987#0", "kind": "evidence", "label": "passage", "name": "qdrant:Q00987#0", "cite": "qdrant:Q00987#0", "returned_by": ["read_snippets"], "mentions": 1, "source": "qdrant", "text": "E3 ubiquitin-protein ligase that mediates ubiquitination of p53/TP53, leading to its degradation by the proteasome (PubMed:29681526, PubMed:21317885). Inhibits p53/TP53- and p73/TP73-mediated cell cycle arrest and apoptosis by binding its transcriptional activation domain.", "status": "fetched", "cited": true, "claims": [0], "theme": "Degradation"}, {"id": "qdrant:Q969K3#3", "kind": "evidence", "label": "passage", "name": "qdrant:Q969K3#3", "cite": "qdrant:Q969K3#3", "returned_by": ["read_snippets"], "mentions": 1, "source": "qdrant", "text": "Negatively regulates p53/TP53 through its direct ubiquitination and targeting to proteasomal degradation (PubMed:17121812). Indirectly, may also negatively regulate p53/TP53 through ubiquitination and degradation of SFN (PubMed:18382127).", "status": "fetched", "cited": true, "claims": [2], "theme": "Degradation"}, {"id": "qdrant:Q96GD4#11", "kind": "evidence", "label": "passage", "name": "qdrant:Q96GD4#11", "cite": "qdrant:Q96GD4#11", "returned_by": ["read_snippets"], "mentions": 1, "source": "qdrant", "text": "Phosphorylation of p53/TP53 negatively regulates its transcriptional activity (PubMed:20959462). Key regulator of active promoters in resting B- and T-lymphocytes: acts by mediating phosphorylation of H3S28ph at active promoters in resting B-cells, inhibiting RNF2/RING1B-mediated ubiquitination of histone H2A and enhancing binding and activity of the USP16 deubiquitinase at transcribed genes (By similarity).", "status": "fetched", "cited": true, "claims": [5], "theme": "Inactivating modification"}, {"id": "qdrant:Q9H9B1#9", "kind": "evidence", "label": "passage", "name": "qdrant:Q9H9B1#9", "cite": "qdrant:Q9H9B1#9", "returned_by": ["read_snippets"], "mentions": 1, "source": "qdrant", "text": "In addition to the histone methyltransferase activity, also methylates non-histone proteins: mediates dimethylation of 'Lys-373' of p53/TP53 (PubMed:20118233). Represses the expression of mitochondrial function-related genes, perhaps by occupying their promoter regions, working in concert with probable chromatin reader BAZ2B (By similarity). .", "status": "fetched", "cited": true, "claims": [8], "theme": "Inactivating modification"}, {"id": "qdrant:Q9NQR1#7", "kind": "evidence", "label": "passage", "name": "qdrant:Q9NQR1#7", "cite": "qdrant:Q9NQR1#7", "returned_by": ["read_snippets"], "mentions": 1, "source": "qdrant", "text": "Mediates monomethylation of p53/TP53 at 'Lys-382', leading to repress p53/TP53-target genes (PubMed:17707234). Plays a negative role in TGF-beta response regulation and a positive role in cell migration (PubMed:23478445). .", "status": "fetched", "cited": true, "claims": [7], "theme": "Inactivating modification"}, {"id": "qdrant:Q9NRG4#3", "kind": "evidence", "label": "passage", "name": "qdrant:Q9NRG4#3", "cite": "qdrant:Q9NRG4#3", "returned_by": ["read_snippets"], "mentions": 1, "source": "qdrant", "text": "Shows even higher methyltransferase activity on p53/TP53. Monomethylates 'Lys-370' of p53/TP53, leading to decreased DNA-binding activity and subsequent transcriptional regulation activity of p53/TP53.", "status": "fetched", "cited": true, "claims": [6], "theme": "Inactivating modification"}, {"id": "O15151", "kind": "entity", "label": "Gene", "name": "MDM4", "cite": "O15151", "returned_by": ["gene_reactions", "reaction_details", "read_snippets"], "mentions": 9, "source": "neo4j", "text": null, "cited": false, "claims": [0, 1], "theme": "Degradation"}, {"id": "Q00987", "kind": "entity", "label": "Gene", "name": "MDM2", "cite": "Q00987", "returned_by": ["gene_reactions", "reaction_details", "read_snippets"], "mentions": 9, "source": "neo4j", "text": null, "cited": false, "claims": [0, 1], "theme": "Degradation"}, {"id": "Q96GD4", "kind": "entity", "label": "Gene", "name": "AURKB", "cite": "Q96GD4", "returned_by": ["gene_reactions", "reaction_details", "read_snippets"], "mentions": 5, "source": "neo4j", "text": null, "cited": false, "claims": [5], "theme": "Inactivating modification"}, {"id": "O14965", "kind": "entity", "label": "Gene", "name" <script>
// ============================================================================
// Transport. Two modes from one file:
//   in a host (Claude Desktop): MCP Apps (ext-apps 2026-01-26), JSON-RPC over
//     postMessage; the tool result carries a view id and the full view is
//     fetched through the app-only evidence_view_data tool
//   standalone (/evidence/<session>/<view>): the view is embedded as
//     window.__EVIDENCE__ and there is no host
// ============================================================================
const PROTOCOL = "2026-01-26";
const STANDALONE = typeof window.__EVIDENCE__ === "object" && window.__EVIDENCE__ !== null;
let host = { capabilities: {}, context: {} };
let nextId = 1;
const pending = new Map();
const $ = (id) => document.getElementById(id);
const send = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
const request = (method, params) => new Promise((resolve, reject) => {
  const id = nextId++; pending.set(id, { resolve, reject }); send({ id, method, params });
});
const notify = (method, params) => { if (!STANDALONE) send({ method, params }); };

if (!STANDALONE) {
  window.addEventListener("message", (ev) => {
    const m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && pending.has(m.id)) {
      const p = pending.get(m.id); pending.delete(m.id);
      return m.error ? p.reject(m.error) : p.resolve(m.result);
    }
    if (m.method === "ui/notifications/tool-result") onToolResult(m.params);
    if (m.method === "ui/notifications/host-context-changed") onContext(m.params);
  });
  request("ui/initialize", { appInfo: { name: "pathwayoracle-evidence", version: "0.3.0" },
                             appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
                             protocolVersion: PROTOCOL })
    .then((res) => {
      host = { capabilities: res.hostCapabilities || {}, context: res.hostContext || {} };
      onContext(host.context);
      notify("ui/notifications/initialized", {});
    })
    .catch((e) => { $("status").textContent = "Could not connect to the host: " + JSON.stringify(e); });
  new ResizeObserver(() => notify("ui/notifications/size-changed",
    { height: Math.ceil(document.documentElement.scrollHeight) })).observe(document.body);
}

function onContext(ctx) {
  if (!ctx) return;
  host.context = { ...host.context, ...ctx };
  const modes = host.context.availableDisplayModes || [];
  $("b-full").hidden = !modes.includes("fullscreen");
  if (host.context.displayMode) document.body.classList.toggle("fullscreen", host.context.displayMode === "fullscreen");
}

// The model-visible result carries only a view id; the graph comes through the
// app-only evidence_view_data tool, so it never enters the model's context.
async function onToolResult(result) {
  const sc = result && result.structuredContent;
  if (!sc || !sc.view_id) { $("status").textContent = (sc && sc.error) || "No view in this result."; return; }
  $("status").textContent = sc.receipt || "";
  try {
    const res = await request("tools/call", { name: "evidence_view_data", arguments: { view_id: sc.view_id } });
    const view = res && (res.structuredContent || JSON.parse((res.content || [{}])[0].text || "{}"));
    if (!view || view.error) throw new Error((view && view.error) || "empty view");
    draw(view);
  } catch (e) {
    $("status").textContent = "Could not load view " + sc.view_id + ": " + (e.message || JSON.stringify(e));
  }
}

// ============================================================================
// Libraries: Cytoscape (cdnjs) + WebCola/cytoscape-cola (jsDelivr) for physics.
// ============================================================================
const LIBS = ["https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.34.3/cytoscape.min.js",
              "https://cdn.jsdelivr.net/npm/webcola@3.4.0/WebCola/cola.min.js",
              "https://cdn.jsdelivr.net/npm/cytoscape-cola@2.5.1/cytoscape-cola.js"];
const load = (src) => new Promise((ok, no) => { const s = document.createElement("script");
  s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
const libs = load(LIBS[0]).then(() => load(LIBS[1]).then(() => load(LIBS[2])).then(() => true).catch(() => false));

// ============================================================================
// Drawing
// ============================================================================
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CATEGORIES = [
  ["gene", "gene", "--gene"], ["reaction", "reaction", "--rxn"], ["pathway", "pathway", "--pathway"],
  ["go", "GO term", "--go"], ["entity", "complex / other", "--entity"], ["passage", "function text", "--passage"],
  ["abstract", "abstract", "--abstract"], ["derived", "derived / group", "--agg"],
];
function categoryOf(n) {
  if (n.kind === "evidence") return n.label === "abstract" ? "abstract" : "passage";
  if (n.kind === "aggregate" || n.kind === "group") return "derived";
  return { Gene: "gene", Reaction: "reaction", Pathway: "pathway", Ontology: "go" }[n.label] || "entity";
}
const colorOf = (n) => css(CATEGORIES.find((c) => c[0] === categoryOf(n))[2]);
const shapeOf = (n) => n.kind === "evidence" ? "tag" : n.kind === "aggregate" ? "diamond"
  : n.kind === "group" ? "round-octagon" : n.label === "Reaction" ? "round-rectangle" : "ellipse";
const short = (s) => { s = String(s || ""); return s.length > 28 ? s.slice(0, 27) + "…" : s; };

let cy = null, view = null, layout = null, physicsOn = true, pinnedClaim = null;
const hiddenCats = new Set();

function nodeEl(n) {
  const data = { ...n, color: colorOf(n), shape: shapeOf(n), cat: categoryOf(n), short: short(n.name || n.id) };
  if (n.theme) data.parent = themeId(n.theme);       // drawn inside its theme's box
  return { group: "nodes", data };
}
const themeId = (name) => "theme:" + name;
function themeEls(v) {
  return (v.themes || []).map((t) => ({ group: "nodes",
    data: { id: themeId(t.name), kind: "theme", name: t.name, short: t.name, claims: t.claims,
            source: t.source || "model" } }));
}
function edgeEl(e) { return { group: "edges", data: { ...e } }; }

function draw(v) {
  view = v;
  drawClaims(v);
  drawLegend();
  const notes = [];
  if (v.overflow) notes.push(`${v.overflow} more nodes folded into groups — click a group to open it.`);
  if (v.unknown && v.unknown.length) notes.push(`Not retrieved this session: ${v.unknown.join(", ")}.`);
  notes.push(`Release ${v.release || "?"} · view ${v.view_id}`);
  $("notes").textContent = notes.join(" ");
  $("b-open").hidden = STANDALONE || !v.standalone_url || !host.capabilities.openLinks;

  libs.then((cola) => {
    if (!window.cytoscape) { $("status").textContent += " (graph library blocked)"; return; }
    const holder = document.createElement("div"); holder.style.cssText = "position:absolute;inset:0";
    $("graph").appendChild(holder);
    cy = window.cy = cytoscape({
      container: holder,
      elements: [...themeEls(v), ...v.nodes.map(nodeEl), ...v.edges.map(edgeEl)],
      style: [
        { selector: "node", style: { "label": "data(short)", "background-color": "data(color)", "shape": "data(shape)",
          "color": css("--fg"), "font-size": 10, "text-valign": "bottom", "text-margin-y": 3,
          "width": 20, "height": 20, "border-width": 0 } },
        { selector: "node[?cited]", style: { "border-width": 2, "border-color": css("--fg"), "width": 26, "height": 26 } },
        { selector: "node[status = 'referenced']", style: { "border-width": 2, "border-style": "dashed", "border-color": css("--warn"), "background-opacity": 0.45 } },
        { selector: "node[kind = 'group']", style: { "border-style": "dashed", "border-width": 2, "border-color": css("--muted"), "width": 30, "height": 30 } },
        { selector: "edge", style: { "curve-style": "bezier", "target-arrow-shape": "triangle", "width": 1.3,
          "line-color": css("--line"), "target-arrow-color": css("--line"), "arrow-scale": 0.8,
          "font-size": 8, "color": css("--muted"), "text-rotation": "autorotate" } },
        // Labels only on cited edges -- the rest name their relation on hover and
        // in the details pane, which keeps dense hubs (e.g. TP53) legible.
        { selector: "edge[?cited]", style: { "label": "data(rel)", "color": css("--fg") } },
        { selector: "edge[rel = 'in_entity']", style: { "line-style": "dotted", "target-arrow-shape": "none", "width": 1 } },
        { selector: "edge[sign = 'negative']", style: { "line-color": css("--neg"), "target-arrow-color": css("--neg") } },
        { selector: "edge[sign = 'positive']", style: { "line-color": css("--pos"), "target-arrow-color": css("--pos") } },
        { selector: "edge[?cited]", style: { "width": 2.6 } },
        { selector: "node[kind = 'theme']", style: { "shape": "round-rectangle", "background-color": css("--panel"),
          "background-opacity": 0.6, "border-width": 1, "border-color": css("--line"), "label": "data(name)",
          "text-valign": "top", "text-halign": "center", "font-size": 11, "font-weight": 600, "color": css("--muted"),
          "padding": 14 } },
        // Where a theme comes from: solid accent = a grouping from the database,
        // dashed = the model's own grouping.
        { selector: "node[kind = 'theme'][source = 'database']", style: { "border-color": css("--accent"), "border-width": 1.5 } },
        { selector: "node[kind = 'theme'][source = 'model']", style: { "border-style": "dashed" } },
        { selector: ".dim", style: { "opacity": 0.12 } },
        { selector: ".hl", style: { "border-width": 3, "border-color": css("--hl"), "line-color": css("--hl"), "target-arrow-color": css("--hl") } },
        { selector: ".sel", style: { "border-width": 3, "border-color": css("--accent") } },
      ],
      layout: { name: "preset" }, minZoom: 0.2, maxZoom: 3,
    });
    wireInteractions();
    cy.layout({ name: "circle", fit: true, padding: 30 }).run();
    relayout(cola, true);
  });
}

function relayout(cola, first) {
  if (layout) layout.stop();
  if (cola && window.cytoscape) {
    layout = cy.elements(":visible").layout({ name: "cola", infinite: physicsOn, animate: true, fit: false,
      randomize: false, avoidOverlap: true, handleDisconnected: true, nodeSpacing: () => 14,
      edgeLength: (e) => (["describes", "cites"].includes(e.data("rel")) ? 70 : 115) });
    layout.run();
    if (first) setTimeout(() => cy.fit(undefined, 30), 900);
  } else {
    layout = cy.elements(":visible").layout({ name: "cose", animate: true, animationDuration: 800, padding: 24 });
    layout.run();
  }
}

// --- claims --------------------------------------------------------------------
function drawClaims(v) {
  const box = $("claims"); box.innerHTML = "";
  if (!v.claims.length) { box.innerHTML = `<div class="cites">No claims — scope "${esc(v.scope)}".</div>`; }
  // Claims under their themes, in the order the themes were first used.
  const order = [...(v.themes || []).map((t) => t.name), null];
  const ordered = order.flatMap((name) => v.claims.filter((c) => (c.theme || null) === name));
  let lastTheme;
  for (const c of ordered) {
    if ((c.theme || null) !== lastTheme && (v.themes || []).length) {
      lastTheme = c.theme || null;
      const h = document.createElement("h2");
      h.textContent = lastTheme || "Other claims";
      h.style.marginTop = "10px";
      const theme = lastTheme && (v.themes.find((t) => t.name === lastTheme) || {});
      if (theme) {
        const db = theme.source === "database";
        h.insertAdjacentHTML("beforeend", ` <span class="badge src ${db ? "database" : "model"}">${db ? "from database" : "model's grouping"}</span>`);
      }
      if (lastTheme) {
        h.style.cursor = "pointer";
        const idx = (v.themes.find((t) => t.name === lastTheme) || {}).claims || [];
        h.addEventListener("mouseenter", () => { if (pinnedClaim === null) highlightMany(idx); });
        h.addEventListener("mouseleave", () => { if (pinnedClaim === null) highlight(null); });
      }
      box.appendChild(h);
      if (theme && theme.source === "database" && (theme.basis || []).length) {
        const b = document.createElement("div");
        b.className = "basis";
        b.textContent = theme.basis.map((x) => `${x.name || x.cite}` + (x.returned_by && x.returned_by.length ? ` (${x.returned_by.join(", ")})` : "")).join(" · ");
        box.appendChild(b);
      }
    }
    const d = document.createElement("div");
    d.className = "claim"; d.dataset.i = c.i;
    const weak = Object.entries(c.cites).filter(([, s]) => s !== "fetched");
    d.innerHTML = `<span class="n">${c.i + 1}.</span>${esc(c.label)}<span class="badge ${c.status}">${c.status}</span>` +
      `<div class="cites">${Object.keys(c.cites).map(esc).join(" · ")}</div>` +
      (weak.length ? `<div class="cites">${weak.map(([k, s]) => `<span class="${s}">${esc(k)}: ${s === "referenced" ? "seen, never read" : "not retrieved"}</span>`).join("; ")}</div>` : "");
    d.addEventListener("mouseenter", () => { if (pinnedClaim === null) highlight(c.i); });
    d.addEventListener("mouseleave", () => { if (pinnedClaim === null) highlight(null); });
    d.addEventListener("click", () => pinClaim(c.i));
    box.appendChild(d);
  }
}
function pinClaim(i) {
  pinnedClaim = pinnedClaim === i ? null : i;
  document.querySelectorAll(".claim").forEach((el) => el.classList.toggle("pinned", Number(el.dataset.i) === pinnedClaim));
  highlight(pinnedClaim);
  if (pinnedClaim !== null && cy) {
    const hit = cy.elements().filter((el) => (el.data("claims") || []).includes(pinnedClaim));
    if (hit.length) cy.animate({ fit: { eles: hit, padding: 60 }, duration: 350 });
  }
}
function highlightMany(indexes) {
  if (!cy) return;
  cy.elements().removeClass("dim hl");
  const hit = cy.elements().filter((el) => (el.data("claims") || []).some((k) => indexes.includes(k)));
  cy.elements().not(hit).not("node[kind = 'theme']").addClass("dim");
  hit.addClass("hl");
}
function highlight(i) {
  if (!cy) return;
  cy.elements().removeClass("dim hl");
  if (i === null) return;
  const hit = cy.elements().filter((el) => (el.data("claims") || []).includes(i));
  cy.elements().not(hit).not("node[kind = 'theme']").addClass("dim");
  hit.addClass("hl");
}

// --- legend (click to hide / show a category) -----------------------------------
function drawLegend() {
  const box = $("legend"); box.innerHTML = "";
  for (const [key, label, color] of CATEGORIES) {
    const s = document.createElement("span");
    s.innerHTML = `<i style="background:var(${color})"></i>${label}`;
    s.title = "Click to hide or show";
    s.addEventListener("click", () => {
      hiddenCats.has(key) ? hiddenCats.delete(key) : hiddenCats.add(key);
      s.classList.toggle("off", hiddenCats.has(key));
      if (cy) cy.nodes().forEach((n) => n.style("display", hiddenCats.has(n.data("cat")) ? "none" : "element"));
    });
    box.appendChild(s);
  }
  const signs = document.createElement("span");
  signs.style.cursor = "default";
  signs.innerHTML = `edges: <b style="color:var(--neg)">negative</b> / <b style="color:var(--pos)">positive</b> · thick = cited · dashed = seen, never read` +
    `<br>theme boxes: <b style="color:var(--accent)">solid</b> = grouping from the database · dashed = the model's own grouping`;
  box.appendChild(signs);
}

// --- hover, click, details, group expansion -----------------------------------------
function wireInteractions() {
  const tip = $("tip");
  const place = (p) => { tip.style.left = Math.max(4, Math.min(p.x + 12, $("graph").clientWidth - 370)) + "px";
                         tip.style.top = (p.y + 12) + "px"; tip.style.display = "block"; };
  cy.on("mouseover", "node", (ev) => {
    const n = ev.target.data();
    tip.innerHTML = `<b>${esc(n.name)}</b>${n.kind === "group" ? "click to expand\n" : ""}${n.text ? esc(n.text.slice(0, 260)) + (n.text.length > 260 ? "…" : "") : ""}`;
    place(ev.renderedPosition);
  });
  cy.on("mouseover", "edge", (ev) => {
    const e = ev.target.data();
    tip.innerHTML = `<b>${esc(e.rel)}</b>${esc([e.mechanism, e.sign, e.reaction].filter(Boolean).join(" · "))}`;
    place(ev.renderedPosition || ev.position);
  });
  cy.on("mouseout", "node, edge", () => { tip.style.display = "none"; });
  cy.on("grab", "node", () => { tip.style.display = "none"; });
  cy.on("tap", "node", (ev) => {
    const n = ev.target.data();
    if (n.kind === "group") return expandGroup(n.id);
    showDetails(n, "node");
    cy.elements().removeClass("sel"); ev.target.addClass("sel");
  });
  cy.on("tap", "edge", (ev) => { showDetails(ev.target.data(), "edge"); cy.elements().removeClass("sel"); ev.target.addClass("sel"); });
  cy.on("tap", (ev) => { if (ev.target === cy) { $("details").style.display = "none"; cy.elements().removeClass("sel"); } });
}

function showDetails(x, type) {
  const box = $("details");
  const claims = (x.claims || []).map((i) => `#${i + 1}`).join(", ");
  const trail = (x.returned_by || []).join(" → ");
  if (type === "node") {
    box.innerHTML = `<h3>${esc(x.name)}</h3>
      <div class="meta">${esc(x.label || x.kind)} · source ${esc(x.source || "-")}${x.status ? ` · <span class="${x.status}">${x.status === "referenced" ? "seen, never read" : "read"}</span>` : ""}${claims ? ` · supports claim ${claims}` : ""}</div>
      ${x.text ? `<div class="text">${esc(x.text)}</div>` : ""}
      <div class="meta" style="margin-top:6px">cite <code>${esc(x.cite || x.id)}</code>${trail ? ` · returned by ${esc(trail)}` : ""}</div>`;
  } else {
    const bits = [x.mechanism, x.sign, x.reaction && `reaction: ${x.reaction}`, x.via && `via ${x.via}`,
                  x.evidence && `evidence ${x.evidence.join(", ")}`].filter(Boolean);
    box.innerHTML = `<h3>${esc(x.rel)}: ${esc(nameOf(x.source))} → ${esc(nameOf(x.target))}</h3>
      <div class="meta">${esc(bits.join(" · "))}${claims ? ` · supports claim ${claims}` : ""}</div>
      ${x.sentence ? `<div class="text">${esc(x.sentence)}</div>` : ""}
      <div class="meta" style="margin-top:6px">${x.cite ? `cite <code>${esc(x.cite)}</code>` : ""}${trail ? ` · returned by ${esc(trail)}` : ""}</div>`;
  }
  box.style.display = "block";
}
const nameOf = (id) => { const n = cy && cy.getElementById(id); return n && n.length ? n.data("name") : id; };

function expandGroup(gid) {
  const members = (view.group_members || {})[gid] || [];
  if (!members.length) return;
  const g = cy.getElementById(gid);
  const at = g.position();
  cy.batch(() => {
    for (const m of members) {
      if (cy.getElementById(m.id).length) continue;
      const el = cy.add(nodeEl(m));
      el.position({ x: at.x + (Math.random() - 0.5) * 80, y: at.y + (Math.random() - 0.5) * 80 });
      if (hiddenCats.has(el.data("cat"))) el.style("display", "none");
    }
    g.remove();
    // Re-add every original edge whose endpoints are now visible; endpoints still
    // inside another group point at that group.
    const groupOf = {};
    for (const [id, ms] of Object.entries(view.group_members || {})) {
      if (cy.getElementById(id).length) ms.forEach((m) => { groupOf[m.id] = id; });
    }
    for (const e of view.group_edges || []) {
      const s = cy.getElementById(e.source).length ? e.source : groupOf[e.source];
      const t = cy.getElementById(e.target).length ? e.target : groupOf[e.target];
      const id = `${s}|${t}|${e.rel}|${e.reaction_id || ""}`;
      if (!s || !t || s === t || cy.getElementById(e.id).length || cy.getElementById(id).length) continue;
      cy.add(edgeEl({ ...e, id, source: s, target: t }));
    }
  });
  libs.then((cola) => relayout(cola, false));
}

// --- toolbar --------------------------------------------------------------------
$("b-fit").addEventListener("click", () => cy && cy.animate({ fit: { padding: 30 }, duration: 300 }));
$("b-phys").addEventListener("click", () => {
  physicsOn = !physicsOn;
  $("b-phys").textContent = physicsOn ? "Pause physics" : "Resume physics";
  if (!physicsOn) { if (layout) layout.stop(); } else libs.then((cola) => relayout(cola, false));
});
$("b-full").addEventListener("click", async () => {
  const want = host.context.displayMode === "fullscreen" ? "inline" : "fullscreen";
  try {
    const res = await request("ui/request-display-mode", { mode: want });
    onContext({ displayMode: (res && res.mode) || want });
    $("b-full").textContent = host.context.displayMode === "fullscreen" ? "Exit fullscreen" : "Fullscreen";
    setTimeout(() => cy && cy.resize() && cy.fit(undefined, 30), 300);
  } catch (_) { $("b-full").hidden = true; }
});
$("b-open").addEventListener("click", () => request("ui/open-link", { url: view.standalone_url }).catch(() => {}));

function b64(str) { return btoa(unescape(encodeURIComponent(str))); }
async function download(name, mime, base64) {
  if (!STANDALONE && host.capabilities.downloadFile) {
    try {
      await request("ui/download-file", { contents: [{ type: "resource",
        resource: { uri: `file:///${name}`, mimeType: mime, blob: base64 } }] });
      return;
    } catch (_) { /* fall through to a plain link */ }
  }
  const a = document.createElement("a");
  a.href = `data:${mime};base64,${base64}`; a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
$("b-png").addEventListener("click", () => cy && download(`evidence-${view.view_id}.png`, "image/png",
  cy.png({ output: "base64", full: true, scale: 2, bg: css("--bg") })));
$("b-json").addEventListener("click", () => view && download(`evidence-${view.view_id}.json`, "application/json",
  b64(JSON.stringify(view, null, 1))));

// Standalone start goes LAST: draw() uses `libs`, `cy`, `view`, ... which are
// only initialised once the whole script has run.
if (STANDALONE) {
  document.title = `Evidence ${window.__EVIDENCE__.view_id || ""}`;
  $("status").textContent = `Standalone view ${window.__EVIDENCE__.view_id} · session ${window.__EVIDENCE__.session}`;
  draw(window.__EVIDENCE__);
}
</script>
</body>
